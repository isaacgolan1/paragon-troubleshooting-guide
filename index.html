<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CaptiveAire Paragon Troubleshooting Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="appRoot">

  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <img src="logo.png" alt="CaptiveAire" />
        <div class="divider"></div>
        <div class="brand-text">
          <div class="eyebrow">Field Diagnostics</div>
          <h1>Paragon Troubleshooting Guide</h1>
        </div>
      </div>
      <div class="mode-toggle">
        <button id="tabBuild" class="active">Build</button>
        <button id="tabPlay">Play</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnAddNode">+ Add node</button>
    <button class="btn" id="btnLoadSample">Load sample tree</button>
    <button class="btn" id="btnNewTree">New blank tree</button>
    <button class="btn" id="btnExport">Export JSON</button>
    <button class="btn" id="btnImport">Import JSON</button>
    <span class="toolbar-divider"></span>
    <button class="btn primary" id="btnExportPlayer">Export Tree (Player)</button>
    <input type="file" id="fileInput" accept=".json,application/json" />
  </div>

  <div id="layout" class="layout"></div>

</div>
<script src="app.js"></script>
</body>
</html>
