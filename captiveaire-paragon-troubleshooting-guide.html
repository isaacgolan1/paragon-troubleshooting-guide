<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CaptiveAire Paragon Troubleshooting Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F5;
    --surface:#FFFFFF;
    --ink:#1C1E21;
    --ink-soft:#5B6167;
    --line:#DCDFE2;
    --line-soft:#EAEBED;
    --accent:#D00000;
    --accent-dark:#A10000;
    --accent-soft:#FBE1E1;
    --success:#1E7A4C;
    --success-soft:#DEEFE5;
    --fail:#8C1414;
    --fail-soft:#F3DEDE;
    --neutral:#5B6167;
    --neutral-soft:#E7E8EA;
    --mono:'IBM Plex Mono', monospace;
    --sans:'Barlow', sans-serif;
    --display:'Barlow Condensed', sans-serif;
    --heavy:'Archivo Black', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px 60px;
  }
  header.masthead{
    background:var(--surface);
    margin:0 -24px 26px;
    padding:20px 24px 0;
    border-bottom:5px solid var(--accent);
  }
  .masthead-inner{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .brand img{ display:block; height:34px; width:auto; }
  .brand .divider{
    width:1px;
    height:34px;
    background:var(--line);
  }
  .brand-text .eyebrow{
    font-family:var(--mono);
    font-size:10px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .brand-text h1{
    font-family:var(--display);
    font-size:26px;
    font-weight:700;
    letter-spacing:0.01em;
    text-transform:uppercase;
    line-height:1;
    margin:0;
  }
  .brand-text .tag{
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .mode-toggle{
    display:flex;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:3px;
    gap:2px;
  }
  .mode-toggle button{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .mode-toggle button.active{
    background:var(--accent);
    color:#fff;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin:22px 0 18px;
  }
  .toolbar-divider{
    width:1px;
    height:22px;
    background:var(--line);
    margin:0 4px;
  }
  .btn{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .btn:hover{ border-color:var(--ink); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .btn.primary:hover{ border-color:var(--accent-dark); background:var(--accent-dark); }
  .btn.danger{
    color:var(--fail);
    border-color:var(--fail-soft);
  }
  .btn.danger:hover{ border-color:var(--fail); }
  .btn.small{ padding:5px 9px; font-size:10.5px; }
  .layout{
    display:grid;
    grid-template-columns:270px 1fr;
    gap:18px;
    align-items:start;
  }
  @media (max-width:820px){
    .layout{ grid-template-columns:1fr; }
  }
  .layout.layout-play{
    display:block;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .panel h2{
    font-family:var(--display);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px 0;
  }
  .node-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .node-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    background:var(--bg);
  }
  .node-item:hover{ border-color:var(--line); }
  .node-item.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    border-width:1px;
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .node-dot{
    width:9px; height:9px; border-radius:50%;
    flex:none;
    background:var(--neutral);
  }
  .node-dot.outcome-success{ background:var(--success); }
  .node-dot.outcome-fail{ background:var(--fail); }
  .node-dot.outcome-neutral{ background:var(--neutral); }
  .node-dot.question{ background:var(--ink); }
  .node-item .label{
    font-size:12.5px;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .node-item .root-badge{
    font-family:var(--mono);
    font-size:9px;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:1px 5px;
    border-radius:4px;
    flex:none;
  }
  .node-del-x{
    flex:none;
    width:18px;
    height:18px;
    line-height:16px;
    text-align:center;
    padding:0;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:15px;
    font-family:var(--sans);
    border-radius:4px;
    cursor:pointer;
  }
  .node-del-x:hover{
    background:var(--fail-soft);
    color:var(--fail);
  }
  .node-legend{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px 10px 12px;
    margin-bottom:12px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .node-legend .legend-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .node-legend .legend-row .node-dot{ flex:none; }
  .node-legend .legend-row span{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .empty-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  /* --- Build panel --- */
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  textarea, input[type=text], select{
    width:100%;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    resize:vertical;
  }
  textarea:focus, input[type=text]:focus, select:focus{
    outline:none;
    border-color:var(--ink);
  }
  .type-switch{
    display:flex;
    gap:8px;
  }
  .type-switch button{
    flex:1;
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:9px 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .type-switch button.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .outcome-type-row{ display:flex; gap:8px; }
  .outcome-type-row button{
    flex:1;
    font-family:var(--mono);
    font-size:10.5px;
    text-transform:uppercase;
    padding:8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--bg);
    cursor:pointer;
    color:var(--ink-soft);
  }
  .outcome-type-row button.active.success{ background:var(--success); border-color:var(--success); color:#fff; }
  .outcome-type-row button.active.fail{ background:var(--fail); border-color:var(--fail); color:#fff; }
  .outcome-type-row button.active.neutral{ background:var(--neutral); border-color:var(--neutral); color:#fff; }

  .option-row{
    display:flex;
    gap:6px;
    margin-bottom:8px;
    align-items:flex-start;
  }
  .option-row input[type=text]{ flex:1.1; }
  .option-row select{ flex:1; }
  .option-row .btn{ flex:none; }
  .add-option-btn{ margin-top:2px; }
  .node-footer-actions{
    display:flex;
    justify-content:space-between;
    margin-top:22px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .image-field-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .image-preview-wrap{
    position:relative;
    flex:none;
  }
  .image-preview{
    width:88px;
    height:88px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--line);
    display:block;
  }
  .image-preview-remove{
    position:absolute;
    top:-7px;
    right:-7px;
    width:20px;
    height:20px;
    line-height:18px;
    text-align:center;
    padding:0;
    border-radius:50%;
    border:1px solid var(--fail-soft);
    background:var(--surface);
    color:var(--fail);
    font-size:13px;
    cursor:pointer;
  }
  .image-empty-slot{
    width:88px;
    height:88px;
    border-radius:8px;
    border:1px dashed var(--line);
    background:var(--bg);
  }
  .node-item .img-badge{
    flex:none;
    font-size:10px;
    color:var(--ink-soft);
  }

  /* --- Play mode --- */
  .trace-wrap{
    overflow-x:auto;
    padding:6px 2px 18px 2px;
    margin-bottom:6px;
  }
  .trace-svg{ display:block; }
  .play-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:40px;
    width:100%;
    box-sizing:border-box;
    min-height:calc(100vh - 300px);
    display:flex;
    flex-direction:column;
  }
  .play-card-body{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .play-image{
    max-width:100%;
    max-height:340px;
    width:auto;
    border-radius:10px;
    border:1px solid var(--line);
    margin-bottom:22px;
    object-fit:contain;
    display:block;
  }
  .play-eyebrow{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }
  .play-question{
    font-family:var(--display);
    font-size:32px;
    font-weight:600;
    line-height:1.22;
    margin:0 0 24px 0;
    max-width:760px;
  }
  .play-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:560px;
  }
  .play-option-btn{
    text-align:left;
    font-family:var(--sans);
    font-size:16px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .play-option-btn:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .play-option-btn{ border-left:3px solid transparent; }
  .play-option-btn:hover{ border-left:3px solid var(--accent); }
  .play-option-btn:active{ transform:translateY(1px); }
  .outcome-banner{
    display:inline-block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:5px;
    margin-bottom:16px;
  }
  .outcome-banner.success{ background:var(--success-soft); color:var(--success); }
  .outcome-banner.fail{ background:var(--fail-soft); color:var(--fail); }
  .outcome-banner.neutral{ background:var(--neutral-soft); color:var(--neutral); }
  .play-resolution{
    font-size:17px;
    line-height:1.6;
    max-width:700px;
    margin-bottom:20px;
  }
  .play-back-row{
    display:flex;
    gap:8px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line-soft);
  }
  .no-root-warning{
    font-size:13px;
    color:var(--fail);
    background:var(--fail-soft);
    border-radius:8px;
    padding:12px 14px;
  }
  input[type=file]{ display:none; }
</style>
</head>

  <div class="toolbar">
    <button class="btn primary" id="btnAddNode">+ Add node</button>
    <button class="btn" id="btnLoadSample">Load sample tree</button>
    <button class="btn" id="btnNewTree">New blank tree</button>
    <button class="btn" id="btnExport">Export JSON</button>
    <button class="btn" id="btnImport">Import JSON</button>
    <span class="toolbar-divider"></span>
    <button class="btn primary" id="btnExportPlayer">Export Tree (Player)</button>
    <input type="file" id="fileInput" accept=".json,application/json" />
  </div>

  <div id="layout" class="layout"></div>

</div>

<script>
(function(){

  // ---------- state ----------
  var tree = null;   // { rootId, nodes: { id: {id,type,text,options:[{label,nextId}], outcomeType, resolution} } }
  var mode = 'build'; // 'build' | 'play'
  var selectedNodeId = null;
  var playPath = [];      // [{nodeId, label}]
  var playCurrentId = null;

  function uid(prefix){
    return (prefix||'n') + '_' + Math.random().toString(36).slice(2,8);
  }

  function sampleTree(){
    var start = uid('q'), noPower = uid('q'), hasPower = uid('q'),
        outSuccess = uid('o'), outFail = uid('o'), outEscalate = uid('o');
    var nodes = {};
    nodes[start] = {
      id:start, type:'question',
      text:'The rooftop unit is not running. What do you see at the unit?',
      options:[
        {label:'No power at all', nextId:noPower},
        {label:'Has power, but will not start', nextId:hasPower}
      ]
    };
    nodes[noPower] = {
      id:noPower, type:'question',
      text:'Is the disconnect switch in the ON position?',
      options:[
        {label:'It was off — switched it on', nextId:outSuccess},
        {label:'Already on, still no power', nextId:outFail}
      ]
    };
    nodes[hasPower] = {
      id:hasPower, type:'question',
      text:'Is the thermostat sending an active call for heat or cool?',
      options:[
        {label:'Yes, call is active but unit is not responding', nextId:outEscalate},
        {label:'No active call present', nextId:outSuccess}
      ]
    };
    nodes[outSuccess] = { id:outSuccess, type:'outcome', outcomeType:'success',
      resolution:'Issue resolved at this step. Confirm the unit runs normally before closing out.' };
    nodes[outFail] = { id:outFail, type:'outcome', outcomeType:'fail',
      resolution:'No power with a good disconnect points to a wiring or electrical fault. Escalate to a qualified technician.' };
    nodes[outEscalate] = { id:outEscalate, type:'outcome', outcomeType:'neutral',
      resolution:'An active call with no response suggests a control fault. Escalate to a qualified technician for further diagnosis.' };
    return { rootId:start, nodes:nodes };
  }

  function blankTree(){
    var start = uid('q');
    var nodes = {};
    nodes[start] = { id:start, type:'question', text:'What question should someone answer first?', options:[] };
    return { rootId:start, nodes:nodes };
  }

  // ---------- helpers ----------
  function nodeList(){
    return Object.keys(tree.nodes).map(function(k){ return tree.nodes[k]; });
  }
  function shortLabel(node){
    var t = node.type === 'question' ? node.text : node.resolution;
    t = (t || '').trim();
    if(!t) return '(empty)';
    return t.length > 46 ? t.slice(0,46) + '…' : t;
  }
  function dotClass(node){
    if(node.type === 'outcome') return 'outcome-' + (node.outcomeType || 'neutral');
    return 'question';
  }

  // ---------- render root ----------
  function render(){
    var layout = document.getElementById('layout');
    layout.innerHTML = '';
    layout.className = 'layout' + (mode==='play' ? ' layout-play' : '');
    if(mode === 'build'){
      layout.appendChild(renderSidebar());
      layout.appendChild(renderBuildPanel());
    } else {
      layout.appendChild(renderPlaySingleColumn());
    }
    document.getElementById('tabBuild').className = mode==='build' ? 'active' : '';
    document.getElementById('tabPlay').className = mode==='play' ? 'active' : '';
  }

  // ---------- sidebar (build mode) ----------
  function deleteNode(nodeId){
    if(nodeId === tree.rootId){ alert('Set a different start node before deleting this one.'); return; }
    delete tree.nodes[nodeId];
    // clear dangling references
    nodeList().forEach(function(n){
      if(n.type === 'question'){
        (n.options||[]).forEach(function(o){ if(o.nextId === nodeId) o.nextId = ''; });
      }
    });
    if(selectedNodeId === nodeId) selectedNodeId = null;
    render();
  }

  function renderSidebar(){
    var panel = document.createElement('div');
    panel.className = 'panel';
    var h = document.createElement('h2');
    h.textContent = 'Nodes (' + nodeList().length + ')';
    panel.appendChild(h);

    var legend = document.createElement('div');
    legend.className = 'node-legend';
    [
      ['question', 'Question — has branching answers'],
      ['outcome-success', 'Resolved — fixed at this step'],
      ['outcome-neutral', 'Escalate — hand off to next tier'],
      ['outcome-fail', 'Unresolved — confirmed fault']
    ].forEach(function(pair){
      var row = document.createElement('div');
      row.className = 'legend-row';
      var dot = document.createElement('div');
      dot.className = 'node-dot ' + pair[0];
      var span = document.createElement('span');
      span.textContent = pair[1];
      row.appendChild(dot);
      row.appendChild(span);
      legend.appendChild(row);
    });
    panel.appendChild(legend);

    var list = document.createElement('div');
    list.className = 'node-list';
    nodeList().forEach(function(node){
      var item = document.createElement('div');
      item.className = 'node-item' + (node.id === selectedNodeId ? ' selected' : '');
      item.onclick = function(){ selectedNodeId = node.id; render(); };

      var dot = document.createElement('div');
      dot.className = 'node-dot ' + dotClass(node);
      item.appendChild(dot);

      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = shortLabel(node);
      item.appendChild(label);

      if(node.image){
        var imgBadge = document.createElement('div');
        imgBadge.className = 'img-badge';
        imgBadge.title = 'Has an image';
        imgBadge.textContent = '📷';
        item.appendChild(imgBadge);
      }

      if(node.id === tree.rootId){
        var badge = document.createElement('div');
        badge.className = 'root-badge';
        badge.textContent = 'START';
        item.appendChild(badge);
      }

      var delX = document.createElement('button');
      delX.className = 'node-del-x';
      delX.textContent = '×';
      delX.title = node.id === tree.rootId ? 'Set a different start node before deleting this one' : 'Delete node';
      delX.onclick = function(e){
        e.stopPropagation();
        if(node.id === tree.rootId){ alert('Set a different start node before deleting this one.'); return; }
        deleteNode(node.id);
      };
      item.appendChild(delX);

      list.appendChild(item);
    });
    panel.appendChild(list);
    return panel;
  }

  // ---------- build panel (node editor) ----------
  function renderBuildPanel(){
    var panel = document.createElement('div');
    panel.className = 'panel';

    var node = tree.nodes[selectedNodeId];
    if(!node){
      var h = document.createElement('h2');
      h.textContent = 'Node editor';
      panel.appendChild(h);
      var hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'Select a node on the left, or add a new one, to start editing.';
      panel.appendChild(hint);
      return panel;
    }

    var h2 = document.createElement('h2');
    h2.textContent = 'Editing · ' + node.id;
    panel.appendChild(h2);

    // type switch
    var typeSwitch = document.createElement('div');
    typeSwitch.className = 'type-switch';
    typeSwitch.style.marginBottom = '18px';
    ['question','outcome'].forEach(function(t){
      var b = document.createElement('button');
      b.textContent = t === 'question' ? 'Question node' : 'Outcome node';
      b.className = node.type === t ? 'active' : '';
      b.onclick = function(){
        node.type = t;
        if(t === 'question' && !node.options) node.options = [];
        if(t === 'outcome' && !node.outcomeType) node.outcomeType = 'neutral';
        render();
      };
      typeSwitch.appendChild(b);
    });
    panel.appendChild(typeSwitch);

    // image upload (applies to any node type)
    var fImg = document.createElement('div'); fImg.className = 'field';
    var lImg = document.createElement('label'); lImg.textContent = 'Image (optional)';
    fImg.appendChild(lImg);

    var imgRow = document.createElement('div'); imgRow.className = 'image-field-row';

    if(node.image){
      var previewWrap = document.createElement('div'); previewWrap.className = 'image-preview-wrap';
      var preview = document.createElement('img'); preview.className = 'image-preview'; preview.src = node.image;
      var removeBtn = document.createElement('button'); removeBtn.className = 'image-preview-remove'; removeBtn.textContent = '×';
      removeBtn.title = 'Remove image';
      removeBtn.onclick = function(){ node.image = null; render(); };
      previewWrap.appendChild(preview);
      previewWrap.appendChild(removeBtn);
      imgRow.appendChild(previewWrap);
    } else {
      var emptySlot = document.createElement('div'); emptySlot.className = 'image-empty-slot';
      imgRow.appendChild(emptySlot);
    }

    var imgBtnWrap = document.createElement('div');
    var imgInput = document.createElement('input');
    imgInput.type = 'file';
    imgInput.accept = 'image/*';
    var imgUploadBtn = document.createElement('button');
    imgUploadBtn.className = 'btn small';
    imgUploadBtn.textContent = node.image ? 'Replace image' : 'Upload image';
    imgUploadBtn.onclick = function(){ imgInput.click(); };
    imgInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        node.image = reader.result;
        render();
      };
      reader.readAsDataURL(file);
    };
    imgBtnWrap.appendChild(imgUploadBtn);
    imgBtnWrap.appendChild(imgInput);
    imgRow.appendChild(imgBtnWrap);

    fImg.appendChild(imgRow);
    panel.appendChild(fImg);

    if(node.type === 'question'){
      // question text
      var f1 = document.createElement('div'); f1.className = 'field';
      var l1 = document.createElement('label'); l1.textContent = 'Question text';
      var ta = document.createElement('textarea'); ta.rows = 2; ta.value = node.text || '';
      ta.oninput = function(){ node.text = ta.value; };
      ta.onblur = function(){ render(); };
      f1.appendChild(l1); f1.appendChild(ta);
      panel.appendChild(f1);

      // options
      var f2 = document.createElement('div'); f2.className = 'field';
      var l2 = document.createElement('label'); l2.textContent = 'Answer options → next node';
      f2.appendChild(l2);

      (node.options||[]).forEach(function(opt, idx){
        var row = document.createElement('div'); row.className = 'option-row';

        var labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.placeholder = 'Answer label';
        labelInput.value = opt.label || '';
        labelInput.oninput = function(){ opt.label = labelInput.value; };

        var select = document.createElement('select');
        var blankOpt = document.createElement('option');
        blankOpt.value = ''; blankOpt.textContent = '— choose target —';
        select.appendChild(blankOpt);
        nodeList().forEach(function(n){
          if(n.id === node.id) return;
          var o = document.createElement('option');
          o.value = n.id;
          o.textContent = n.id + ' · ' + shortLabel(n);
          if(opt.nextId === n.id) o.selected = true;
          select.appendChild(o);

        var newOpt = document.createElement('option');
        newOpt.value = '__new__';
        newOpt.textContent = '+ Create new node';
        select.appendChild(newOpt);

          if(select.value === '__new__'){

            tree.nodes[nn] = { id:nn, type:'question', text:'New question', options:[] };

        del.textContent = '✕';

        row.appendChild(select);

      var addOpt = document.createElement('button');
      addOpt.className = 'btn small add-option-btn';
      addOpt.textContent = '+ Add answer option';
      addOpt.onclick = function(){
        node.options = node.options || [];

      f2.appendChild(addOpt);

      var row3 = document.createElement('div'); row3.className = 'outcome-type-row';

        var b = document.createElement('button');

      panel.appendChild(f3);

    footer.appendChild(delNode);

    return panel;

  // ---------- play mode ----------
  function resetPlay(){
    playPath = [];
    playCurrentId = tree.rootId;
  }

  function traceSVG(){
    var wrap = document.createElement('div');
    wrap.className = 'trace-wrap';
    var steps = playPath.concat([{nodeId:playCurrentId}]);
    var spacing = 130, r = 8, y = 20, w = Math.max(steps.length * spacing + 40, 200);
    var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','trace-svg');
    svg.setAttribute('width', w);
    svg.setAttribute('height', 46);
    svg.setAttribute('viewBox','0 0 ' + w + ' 46');

    steps.forEach(function(step, i){
      var cx = 30 + i*spacing;
      if(i > 0){
        var line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', 30 + (i-1)*spacing + r);
        line.setAttribute('y1', y);
        line.setAttribute('x2', cx - r);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', '#D00000');
        line.setAttribute('stroke-width', '2');
        svg.appendChild(line);
      }
      var n = tree.nodes[step.nodeId];
      var fill = '#D00000';
      if(n && n.type === 'outcome'){
        fill = n.outcomeType === 'success' ? '#1E7A4C' : n.outcomeType === 'fail' ? '#8C1414' : '#5B6167';
      } else if(i < steps.length - 1){
        fill = '#1C1E21';
      }
      var circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', y);
      circle.setAttribute('r', r);
      circle.setAttribute('fill', fill);
      svg.appendChild(circle);

      if(i < playPath.length){
        var label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', cx);
        label.setAttribute('y', y + 24);
        label.setAttribute('text-anchor','middle');
        label.setAttribute('font-family','IBM Plex Mono, monospace');
        label.setAttribute('font-size','9');
        label.setAttribute('fill','#4A5D68');
        var lbl = (playPath[i].label || '').slice(0,14);
        label.textContent = lbl + ((playPath[i].label||'').length>14?'…':'');
        svg.appendChild(label);
      }
    });
    wrap.appendChild(svg);
    return wrap;
  }

  function renderPlaySingleColumn(){
    var col = document.createElement('div');

    if(!tree.rootId || !tree.nodes[tree.rootId]){
      var warn = document.createElement('div');
      warn.className = 'no-root-warning';
      warn.textContent = 'This tree has no start node set. Go to Build, select a node, and click "Set as start node".';
      col.appendChild(warn);
      return col;
    }

    if(playCurrentId === null){ resetPlay(); }
    col.appendChild(traceSVG());

    var node = tree.nodes[playCurrentId];
    var card = document.createElement('div');
    card.className = 'play-card';
    var body = document.createElement('div');
    body.className = 'play-card-body';

    if(!node){
      var missing = document.createElement('div');
      missing.className = 'no-root-warning';
      missing.textContent = 'This path points to a node that no longer exists.';
      body.appendChild(missing);
    } else if(node.type === 'question'){
      var eyebrow = document.createElement('div');
      eyebrow.className = 'play-eyebrow';
      eyebrow.textContent = 'Step ' + (playPath.length + 1);
      body.appendChild(eyebrow);

      if(node.image){
        var img = document.createElement('img');
        img.className = 'play-image';
        img.src = node.image;
        body.appendChild(img);
      }

      var q = document.createElement('div');
      q.className = 'play-question';
      q.textContent = node.text || '(no question text set)';
      body.appendChild(q);

      var opts = document.createElement('div');
      opts.className = 'play-options';
      (node.options||[]).forEach(function(opt){
        var b = document.createElement('button');
        b.className = 'play-option-btn';
        b.textContent = opt.label || '(unlabeled option)';
        b.disabled = !opt.nextId;
        b.onclick = function(){
          playPath.push({nodeId:node.id, label:opt.label});
          playCurrentId = opt.nextId;
          render();
        };
        opts.appendChild(b);
      });
      if(!(node.options||[]).length){
        var noOpts = document.createElement('div');
        noOpts.className = 'empty-hint';
        noOpts.textContent = 'This question has no answer options yet — add some in Build mode.';
        opts.appendChild(noOpts);
      }
      body.appendChild(opts);

    } else {
      var banner = document.createElement('div');
      banner.className = 'outcome-banner ' + (node.outcomeType || 'neutral');
      banner.textContent = node.outcomeType === 'success' ? 'Resolved' : node.outcomeType === 'fail' ? 'Unresolved' : 'Escalate';
      body.appendChild(banner);

      if(node.image){
        var img2 = document.createElement('img');
        img2.className = 'play-image';
        img2.src = node.image;
        body.appendChild(img2);
      }

      var res = document.createElement('div');
      res.className = 'play-resolution';
      res.textContent = node.resolution || '(no resolution text set)';
      body.appendChild(res);
    }

    card.appendChild(body);

    var backRow = document.createElement('div');
    backRow.className = 'play-back-row';
    if(playPath.length > 0){
      var back = document.createElement('button');
      back.className = 'btn';
      back.textContent = '← Back one step';
      back.onclick = function(){
        var last = playPath.pop();
        playCurrentId = last.nodeId;
        render();
      };
      backRow.appendChild(back);
    }
    var restart = document.createElement('button');
    restart.className = 'btn';
    restart.textContent = 'Start over';
    restart.onclick = function(){ resetPlay(); render(); };
    backRow.appendChild(restart);
    card.appendChild(backRow);

    col.appendChild(card);
    return col;
  }

        mode = 'build';

    ].join('\n');

    var doc = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8" />\n<title>' + titleText + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +

      '<style>\n' + cssText + '\n</style>\n</head>\n<body>\n' +

      '</div>\n' +
      '<script>\n' + playerScript + '\n</' + 'script>\n' +
      '</body>\n</html>';

    var blob = new Blob([doc], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'paragon-troubleshooting-guide-player.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // ---------- init ----------
  tree = sampleTree();
  selectedNodeId = tree.rootId;
  render();

})();
</script>
